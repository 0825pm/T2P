name: T2P_VQAE
data:
    src: "text"
    trg: "skels"
    files: "files"

    train: "/home/user/Projects/Data/new_phoenix/train"
    dev: "/home/user/Projects/Data/new_phoenix/dev"
    test: "/home/user/Projects/Data/new_phoenix/test"

    max_sent_length: 300
    skip_frames: 1
    src_vocab: "/home/user/Projects/research/HoT/dataset/text_src_vocab.txt"
    
    # ============================================
    # 윈도우 및 길이 설정 (NEW)
    # ============================================
    window_size: 64          # Train에서 사용할 윈도우 크기
    min_motion_length: 20    # 최소 모션 길이 (이보다 짧으면 보간)
    max_motion_length: 300   # 최대 모션 길이 (이보다 길면 축소)

training:
  random_seed: 1126
  optimizer: "adam"
  learning_rate: 0.001
  learning_rate_min: 0.0002
  weight_decay: 0.0
  clip_grad_norm: 5.0
  batch_size: 64
  scheduling: "plateau"
  patience: 7
  decrease_factor: 0.7
  early_stopping_metric: "dtw"
  epochs: 1000
  validation_freq: 2000
  logging_freq: 250
  eval_metric: "dtw"
  model_dir: "/home/user/Projects/research/HoT/results/vqae_exp"
  overwrite: False
  continue: True
  shuffle: True
  use_cuda: True
  max_output_length: 300
  keep_last_ckpts: 1
  gpu: 0
  workers: 32
  lr_decay_large: 0.5
  lr_decay_epoch: 200
  lr_decay: 0.99
  warmup_epochs: 0
  warmup_lr: 1e-6
  cooldown_epochs: 10
  patience_epochs: 10
  min_lr: 1.0e-08
  decay_epochs: 30
  decay_rate: 0.1
  sched: "cosine"

model:
  trg_size: 150
  n_joints: 50
  out_joints: 50
  qae:
    # SOKE VQVae 설정
    nfeats: 150              # 입력 feature 크기 (50 joints * 3)
    quantizer: "ema_reset"   # quantizer 종류
    code_num: 512            # codebook 크기
    code_dim: 512            # code dimension
    output_emb_width: 512    # encoder output dimension
    down_t: 2                # temporal downsampling 횟수
    stride_t: 2              # stride
    width: 512               # hidden dimension
    depth: 3                 # resnet depth
    dilation_growth_rate: 3  # dilation growth
    norm: null               # normalization (null, "LN", "GN", "BN")
    activation: "relu"       # activation function