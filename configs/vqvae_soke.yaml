# SOKE Decouple VQ-VAE Config
# Separate codebooks for body/hands based VQ-VAE for Sign Language Motion
# Compatible with How2Sign, CSL-Daily, Phoenix-2014T

name: vqvae_soke

# =============================================================================
# Data Configuration
# =============================================================================
data:
  # Data roots (modify these paths for your setup)
  data_root: "/home/user/Projects/research/SOKE/data/How2Sign"
  csl_root: "/home/user/Projects/research/SOKE/data/CSL-Daily"
  
  # Phoenix-2014T paths
  phoenix_root: "/home/user/Projects/research/SOKE/data/Phoenix_2014T"                                         # Pose pkl files (used by SOKE dataloader)
  phoenix_features_root: "/home/user/Projects/Data/PHOENIX-2014-T-release-v3/PHOENIX-2014-T/features/fullFrame-210x260px"   # Original images (for visualization)
  
  # Mean/Std paths (from SOKE preprocessing)
  mean_path: "/home/user/Projects/research/SOKE/data/CSL-Daily/mean.pt"
  std_path: "/home/user/Projects/research/SOKE/data/CSL-Daily/std.pt"
  
  # Which datasets to use (combine with underscore)
  # Options: 'how2sign', 'csl', 'phoenix', 'how2sign_csl', 'how2sign_csl_phoenix'
  # dataset_name: "how2sign_csl_phoenix"
  dataset_name: "csl"
  
  # Motion length settings
  min_motion_length: 40    # Minimum frames (shorter will be padded)
  max_motion_length: 300   # Maximum frames (longer will be downsampled)
  unit_length: 4           # Frame alignment (for VQ-VAE downsampling)
  
  # Window size for training (null = use full sequence with variable lengths)
  # Set to a number (e.g. 64) to use fixed-size random crops
  win_size: 64

# =============================================================================
# Model Configuration (SOKE Decouple VQ-VAE)
# =============================================================================
model:
  # SOKE uses 133 dims (filtered SMPL-X axis-angle rotations)
  # Split: body(24) + rhand(63) + lhand(46) = 133
  nfeats: 133
  
  # Part dimensions (SOKE format)
  body_nfeats: 24          # upper body
  rhand_nfeats: 63         # right hand (21 joints * 3)
  lhand_nfeats: 46         # left hand (15 joints * 3 + 1)
  
  # Codebook settings (separate for each part)
  body_code_num: 96        # Body codebook size
  hand_code_num: 192       # Hand codebook size (for both lhand, rhand)
  code_dim: 512            # Codebook embedding dimension
  
  # Encoder/Decoder architecture
  output_emb_width: 512    # Encoder output / Decoder input width
  down_t: 2                # Temporal downsampling layers (4x total)
  stride_t: 2              # Stride per layer
  width: 512               # Hidden dimension
  depth: 3                 # ResNet blocks per layer
  dilation_growth_rate: 3  # Dilation growth
  
  # Normalization and activation
  norm: null               # Options: null, 'batch', 'layer'
  activation: "relu"       # Options: 'relu', 'gelu', 'silu'

# =============================================================================
# SMPL-X Configuration (for metric computation)
# =============================================================================
smplx:
  model_path: "/home/user/Projects/research/SOKE/deps/smpl_models"   # Path to SMPL-X model files
  gender: "neutral"
  use_pca: false
  use_face_contour: true
  num_betas: 10
  num_expression_coeffs: 10

# =============================================================================
# Training Configuration
# =============================================================================
training:
  epochs: 500
  batch_size: 64
  num_workers: 8
  seed: 42
  
  # Optimizer
  learning_rate: 0.0001
  learning_rate_min: 0.000001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  
  # Loss weights
  lambda_recon: 1.0        # Reconstruction loss weight
  lambda_velocity: 0.5     # Velocity loss weight
  lambda_commit: 0.02      # Commitment loss weight
  
  # Checkpointing
  model_dir: "checkpoints/vqvae_soke"
  save_every: 10           # Save checkpoint every N epochs
  
  # Logging
  log_every: 100           # Log every N batches

# =============================================================================
# Evaluation Configuration  
# =============================================================================
evaluation:
  batch_size: 64
  num_workers: 4
  
  # Use SMPL-X forward pass for metric computation
  use_smplx: true