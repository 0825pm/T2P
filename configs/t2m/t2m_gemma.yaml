# =============================================================================
# Text-to-Motion Training Configuration with Gemma 2B
# Interleaved decoding: <BODY_x> <LHAND_y> <RHAND_z> per timestep
# =============================================================================

name: T2M_Gemma2B

data:
    src: "text"
    trg: "skels"
    files: "files"

    train: "/home/user/Projects/Data/new_phoenix/train"
    dev: "/home/user/Projects/Data/new_phoenix/dev"
    test: "/home/user/Projects/Data/new_phoenix/test"
    
    # Pre-extracted motion codes from VQ-VAE (decouple)
    motion_code_path: "/home/user/Projects/Data/new_phoenix/motion_codes_decouple"
    
    max_sent_length: 128
    skip_frames: 1

    min_motion_length: 10
    max_motion_length: 150   # timesteps (not tokens)
    unit_length: 4
    framerate: 25.0

model:
    # Base LLM
    base_model: "google/gemma-2b"
    # base_model: "google/gemma-2-2b"  # Alternative: Gemma 2
    
    # Codebook sizes (must match VQ-VAE decouple)
    body_code_num: 96
    lhand_code_num: 192
    rhand_code_num: 192
    
    # Temporal downsampling factor from VQ-VAE
    down_t: 2
    
    # Sequence lengths
    max_text_length: 128
    max_motion_length: 150   # timesteps
    # Total motion tokens = max_motion_length * 3 (interleaved)
    
    # Motion token format
    motion_format: "interleaved"  # <BODY> <LHAND> <RHAND> per timestep
    
    # LoRA configuration (recommended for efficient fine-tuning)
    use_lora: true
    lora_r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    lora_target_modules:
        - "q_proj"
        - "k_proj"
        - "v_proj"
        - "o_proj"
        - "gate_proj"
        - "up_proj"
        - "down_proj"
    
    # Full fine-tuning (if use_lora: false)
    freeze_embeddings: false
    
    # Generation settings
    generation:
        max_new_tokens: 512   # max_motion_length * 3 + buffer
        temperature: 0.8
        top_p: 0.95
        top_k: 50
        do_sample: true
        num_beams: 1
        repetition_penalty: 1.1

training:
    # Batch settings
    batch_size: 4
    gradient_accumulation_steps: 8
    effective_batch_size: 32  # batch_size * gradient_accumulation
    
    # Learning rate
    learning_rate: 2.0e-5
    learning_rate_min: 1.0e-6
    weight_decay: 0.01
    
    # Schedule
    epochs: 50
    warmup_ratio: 0.1
    lr_scheduler: "cosine"
    
    # Gradient
    clip_grad_norm: 1.0
    
    # Precision
    fp16: false
    bf16: true  # Recommended for Gemma
    
    # Logging & Evaluation
    logging_steps: 50
    eval_steps: 500
    save_steps: 1000
    eval_strategy: "steps"
    
    # Checkpointing
    save_total_limit: 3
    load_best_model_at_end: true
    metric_for_best_model: "eval_loss"
    greater_is_better: false
    
    # Output
    output_dir: "experiments/t2m_gemma"
    logging_dir: "experiments/t2m_gemma/logs"
    
    # Reproducibility
    seed: 42
    
    # Workers
    dataloader_num_workers: 4

loss:
    # Loss only on motion tokens (ignore text tokens)
    motion_only_loss: true
    
    # Label smoothing
    label_smoothing: 0.0

evaluation:
    # VQ-VAE checkpoint for decoding generated codes to poses
    vqvae_path: "/home/user/Projects/research/T2P/checkpoint/vqvae_decouple_1223_2338_47_/model_best.pth"
    vqvae_config: "configs/vae/vqvae_decouple.yaml"
    
    # Metrics
    compute_dtw: true
    compute_mpjpe: true
    
    # Generation samples
    num_eval_samples: 100
    max_gen_length: 150

# Special tokens
special_tokens:
    motion_start: "<MOTION_START>"
    motion_end: "<MOTION_END>"
    body_prefix: "<BODY_"
    lhand_prefix: "<LHAND_"
    rhand_prefix: "<RHAND_"
    token_suffix: ">"
