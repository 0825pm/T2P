# Text-to-Motion Training Configuration with mBART
# Multi-head decoding for body, left hand, right hand

name: T2M_mBART

data:
    src: "text"
    trg: "skels"
    files: "files"

    train: "/home/user/Projects/Data/new_phoenix/train"
    dev: "/home/user/Projects/Data/new_phoenix/dev"
    test: "/home/user/Projects/Data/new_phoenix/test"
    
    # Pre-extracted motion codes from VQ-VAE
    motion_code_path: "/home/user/Projects/Data/new_phoenix/motion_codes_decouple"
    
    max_sent_length: 300
    skip_frames: 1
    src_vocab: "/home/user/Projects/research/HoT/dataset/text_src_vocab.txt"

    min_motion_length: 40
    max_motion_length: 300
    unit_length: 4
    framerate: 25.0

training:
    batch_size: 16  # Smaller than VAE due to mBART size
    epochs: 150
    learning_rate: 0.0002
    learning_rate_min: 0.000001
    weight_decay: 0.01
    eval_every: 10
    clip_grad_norm: 1.0
    validation_freq: 1
    logging_freq: 100
    workers: 4
    model_dir: "experiments/t2m"
    
    # Scheduler settings (for timm)
    sched: "cosine"
    warmup_epochs: 5
    warmup_lr: 0.000001
    min_lr: 0.000001
    decay_rate: 0.1
    decay_epochs: 30
    patience_epochs: 10
    cooldown_epochs: 10
    lr_decay: 0.99
    lr_decay_large: 0.5
    lr_decay_epoch: 50

model:
  lm_model_path: "facebook/mbart-large-cc25"
  lm_model_type: "mbart_multi"
  body_code_num: 96
  hand_code_num: 192
  rhand_code_num: 192
  max_length: 256
  num_heads: 3
  down_t: 2
  # Regularization
  label_smoothing: 0.0
  dropout: 0.2
  freeze_encoder: true
  # VQ-VAE for evaluation
  vqvae_path: "/home/user/Projects/research/T2P/checkpoint/vqvae_decouple_1223_2338_47_/model_48_22.3212.pth"

loss:
    lambda_body: 1.0
    lambda_hand: 1.0
    lambda_rhand: 1.0